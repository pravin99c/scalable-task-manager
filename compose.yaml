# Canonical TaskForge local-only Laravel Sail stack.
# Requires PHP/Composer dependencies installed (vendor/laravel/sail).
services:
  laravel.test:
    build:
      context: ./vendor/laravel/sail/runtimes/8.4
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP:-1000}'
    image: taskforge-sail-8.4/app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:80'
      - '127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: '1'
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
      IGNITION_LOCAL_SITES_PATH: '${PWD:-.}'
    volumes:
      - '.:/var/www/html'
    networks:
      - sail
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    ports:
      - '127.0.0.1:${FORWARD_DB_PORT:-33060}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in your untracked .env}'
      MYSQL_DATABASE: '${DB_DATABASE:-taskforge}'
      MYSQL_USER: '${DB_USERNAME:-taskforge}'
      MYSQL_PASSWORD: '${DB_PASSWORD:?Set DB_PASSWORD in your untracked .env}'
    volumes:
      - sail-mysql:/var/lib/mysql
    networks:
      - sail
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '--silent']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  redis:
    image: redis:7.4-alpine
    ports:
      - '127.0.0.1:${FORWARD_REDIS_PORT:-63790}:6379'
    volumes:
      - sail-redis:/data
    networks:
      - sail
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
networks:
  sail:
    driver: bridge
volumes:
  sail-mysql:
  sail-redis:
