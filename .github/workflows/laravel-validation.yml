name: Laravel security validation

# Avoid duplicate CI runs for every feature-branch push. A pull request
# runs the full suite; merges to long-lived branches run it again.
on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - development
      - main

# New commits on the same PR cancel older still-running builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax-and-tests:
    name: PHP lint and Laravel tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_test_only
          MYSQL_DATABASE: taskforge_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot_test_only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      # CI-only disposable credentials for Docker Compose smoke tests.
      DB_ROOT_PASSWORD: only-for-disposable-ci-root
      DB_PASSWORD: only-for-disposable-ci-app
      DB_USERNAME: taskforge
      DB_DATABASE: taskforge_ci_compose
      FORWARD_DB_PORT: '33061'
      FORWARD_REDIS_PORT: '63791'
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, sqlite3, bcmath, xml, curl, zip
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # Once a reviewed package-lock.json is checked in, npm ci uses its
      # exact dependency graph. Until then retain the existing npm install
      # behavior; remove this fallback after lockfile adoption.
      - name: Install frontend dependencies
        run: |
          if test -f package-lock.json; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::package-lock.json missing; npm install is not reproducible"
            npm install --no-audit --no-fund
          fi
      - name: TypeScript type checking
        run: npm run typecheck
      - name: React component and API tests
        run: npm test
      - name: Frontend production build
        run: npm run build
      # npm install generates a real registry-resolved lockfile while the
      # checked-in lockfile is absent. Surface it for manual review rather
      # than committing from a CI token or changing the test branch.
      - name: Verify generated npm lockfile is valid JSON
        run: |
          node - <<'JS'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (![2, 3].includes(lock.lockfileVersion) || !lock.packages || !lock.packages['']) {
            throw new Error('Invalid npm lockfile structure');
          }
          console.log('npm lockfile validated; version ' + lock.lockfileVersion);
          JS
      - name: Upload npm lockfile for maintainer review
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: taskforge-npm-lockfile-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      # Findings must be reviewed by maintainers; advisory service outages
      # should not weaken the existing mandatory Laravel/browser test gates.
      - name: Composer dependency advisory report
        shell: bash
        run: |
          if composer audit --locked --no-interaction; then
            echo 'Composer advisory check completed without reported findings.'
          else
            echo '::warning::Composer advisory findings or registry failure: review before release.'
          fi
      - name: npm high-severity advisory report
        shell: bash
        run: |
          if npm audit --package-lock-only --audit-level=high; then
            echo 'npm audit completed without high-severity findings.'
          else
            echo '::warning::npm audit findings or registry failure: review before release.'
          fi
      - name: PHP syntax checks
        run: |
          find app database routes tests bootstrap -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Synthetic Python release and benchmark safety tests
        run: python3 -m unittest discover -s tests/ci -p 'test_*.py' -v
      - name: Release artifact report (non-blocking during migration)
        run: python3 scripts/release_quality_gate.py
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Validate canonical and legacy Compose entrypoints
        run: |
          test -f vendor/laravel/sail/runtimes/8.4/Dockerfile
          docker compose -f compose.yaml config --quiet
          docker compose -f docker-compose.yml config --quiet
      - name: Smoke test local MySQL and Redis containers
        run: |
          docker compose -f compose.yaml up -d --wait --wait-timeout 180 mysql redis
          test "$(docker compose -f compose.yaml exec -T redis redis-cli ping)" = "PONG"
          docker compose -f compose.yaml exec -T mysql sh -c 'mysql -h 127.0.0.1 -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" -N -B -e "SELECT 1"' | grep -qx 1
      - name: Verify fresh MySQL migration
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: taskforge_ci
          DB_USERNAME: root
          DB_PASSWORD: root_test_only
        run: php artisan migrate:fresh --force
      - name: Feature and unit tests (isolated SQLite)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
        run: php artisan test --stop-on-failure
      - name: Install Chromium browser and required libraries
        run: npx playwright install --with-deps chromium

      - name: Prepare synthetic E2E database (no outgoing mail)
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/taskforge_e2e.sqlite
          SESSION_DRIVER: database
          QUEUE_CONNECTION: database
          MAIL_MAILER: array
          CACHE_STORE: array
          TASKFORGE_ALLOW_E2E_SEED: '1'
        run: |
          touch database/taskforge_e2e.sqlite
          php artisan migrate:fresh --force
          php artisan db:seed --class=TaskForgeE2eSeeder --force

      - name: Real-browser Playwright E2E tests
        timeout-minutes: 8
        env:
          CI: 'true'
          APP_ENV: local
          APP_DEBUG: 'false'
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/taskforge_e2e.sqlite
          SESSION_DRIVER: database
          QUEUE_CONNECTION: database
          MAIL_MAILER: array
          CACHE_STORE: array
          APP_URL: http://127.0.0.1:8085
        run: npm run test:e2e

      - name: Set up isolated Sail application database credentials
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path('.env')
          values = {key: os.environ[key] for key in ('DB_DATABASE', 'DB_USERNAME', 'DB_PASSWORD', 'DB_ROOT_PASSWORD')}
          lines = path.read_text().splitlines()
          updated = []
          for line in lines:
              key = line.split('=', 1)[0]
              updated.append(key + '=' + values[key] if key in values else line)
          path.write_text(chr(10).join(updated) + chr(10))
          PY
      # The full Sail PHP 8.4 image was previously rebuilt from scratch
      # on every ephemeral GitHub runner (~4m20s combined build/start step).
      # Keep the exact same Dockerfile and service smoke coverage, but reuse
      # BuildKit layers when GitHub Actions cache is warm.
      - name: Set up Docker Buildx for cached Sail image
        uses: docker/setup-buildx-action@v3
      - name: Build Sail PHP image (cached layers)
        uses: docker/build-push-action@v6
        with:
          context: ./vendor/laravel/sail/runtimes/8.4
          file: ./vendor/laravel/sail/runtimes/8.4/Dockerfile
          build-args: |
            WWWGROUP=1000
          tags: taskforge-sail-8.4/app:latest
          load: true
          push: false
          cache-from: type=gha,scope=taskforge-sail-php84
          cache-to: type=gha,scope=taskforge-sail-php84,mode=max,ignore-error=true
      - name: Start complete Sail Laravel application (integration smoke)
        timeout-minutes: 14
        run: |
          export BUILDKIT_PROGRESS=plain
          docker compose -f compose.yaml up -d --no-build --wait --wait-timeout 240 laravel.test
          docker compose -f compose.yaml exec -T laravel.test php artisan migrate --force
          docker compose -f compose.yaml exec -T laravel.test php artisan migrate:status
          for attempt in $(seq 1 35); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/ || true)"
            if [ "$code" = "302" ] || [ "$code" = "200" ]; then
              break
            fi
            sleep 2
          done
          test "$code" = "302" -o "$code" = "200"
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Accept: application/json' http://127.0.0.1:8080/api/v2/projects || true)"
          test "$code" = "401"
      - name: Real database queue integration tests (MySQL)
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: taskforge_ci
          DB_USERNAME: root
          DB_PASSWORD: root_test_only
          QUEUE_CONNECTION: database
          DB_QUEUE_CONNECTION: mysql
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: php artisan test --filter='DurableMailIntegrationTest|Phase35SecurityTest' --stop-on-failure
      - name: Verify scheduled cleanup and operations heartbeat
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: taskforge_ci
          DB_USERNAME: root
          DB_PASSWORD: root_test_only
          CACHE_STORE: database
        run: |
          php artisan schedule:list
          php artisan invitations:prune
          php artisan taskforge:operations-check
      - name: Print Sail diagnostics when Docker validation fails
        if: failure()
        run: |
          docker compose -f compose.yaml ps || true
          docker compose -f compose.yaml logs --no-color --tail=100 laravel.test mysql redis || true

      - name: Stop disposable Compose services
        if: always()
        run: docker compose -f compose.yaml down --volumes --remove-orphans
