name: Laravel security validation

on:
  push:
    branches:
      - development
      - main
      - 'fix/**'
      - 'feat/**'
      - 'chore/**'
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read

jobs:
  syntax-and-tests:
    name: PHP lint and Laravel tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_test_only
          MYSQL_DATABASE: taskforge_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot_test_only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, sqlite3, bcmath, xml, curl, zip
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader
      - name: PHP syntax checks
        run: |
          find app database routes tests bootstrap -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Verify fresh MySQL migration
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: taskforge_ci
          DB_USERNAME: root
          DB_PASSWORD: root_test_only
        run: php artisan migrate:fresh --force
      - name: Feature and unit tests (isolated SQLite)
        run: php artisan test --stop-on-failure
