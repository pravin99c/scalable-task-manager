name: Laravel security validation

on:
  push:
    branches:
      - main
      - development
      - 'fix/**'
      - 'feat/**'
      - 'chore/**'
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read

jobs:
  syntax-and-tests:
    name: PHP lint and Laravel tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_test_only
          MYSQL_DATABASE: taskforge_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot_test_only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      # CI-only disposable credentials for Docker Compose smoke tests.
      DB_ROOT_PASSWORD: only-for-disposable-ci-root
      DB_PASSWORD: only-for-disposable-ci-app
      DB_USERNAME: taskforge
      DB_DATABASE: taskforge_ci_compose
      FORWARD_DB_PORT: '33061'
      FORWARD_REDIS_PORT: '63791'
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, sqlite3, bcmath, xml, curl, zip
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader
      - name: PHP syntax checks
        run: |
          find app database routes tests bootstrap -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Validate canonical and legacy Compose entrypoints
        run: |
          test -f vendor/laravel/sail/runtimes/8.4/Dockerfile
          docker compose -f compose.yaml config --quiet
          docker compose -f docker-compose.yml config --quiet
      - name: Smoke test local MySQL and Redis containers
        run: |
          docker compose -f compose.yaml up -d --wait --wait-timeout 180 mysql redis
          test "$(docker compose -f compose.yaml exec -T redis redis-cli ping)" = "PONG"
          docker compose -f compose.yaml exec -T mysql sh -c 'mysql -h 127.0.0.1 -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" -N -B -e "SELECT 1"' | grep -qx 1
      - name: Verify fresh MySQL migration
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: taskforge_ci
          DB_USERNAME: root
          DB_PASSWORD: root_test_only
        run: php artisan migrate:fresh --force
      - name: Feature and unit tests (isolated SQLite)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
        run: php artisan test --stop-on-failure
      - name: Start complete Sail Laravel application (integration smoke)
        run: |
          docker compose -f compose.yaml up -d --build --wait --wait-timeout 240 laravel.test
          docker compose -f compose.yaml exec -T laravel.test php artisan migrate:status
          for attempt in $(seq 1 35); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/ || true)"
            if [ "$code" = "302" ] || [ "$code" = "200" ]; then
              break
            fi
            sleep 2
          done
          test "$code" = "302" -o "$code" = "200"
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Accept: application/json' http://127.0.0.1:8080/api/v2/projects || true)"
          test "$code" = "401"
      - name: Real database queue integration tests (MySQL)
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: taskforge_ci
          DB_USERNAME: root
          DB_PASSWORD: root_test_only
          QUEUE_CONNECTION: database
          DB_QUEUE_CONNECTION: mysql
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: php artisan test --filter=DurableMailIntegrationTest --stop-on-failure
      - name: Stop disposable Compose services
        if: always()
        run: docker compose -f compose.yaml down --volumes --remove-orphans
