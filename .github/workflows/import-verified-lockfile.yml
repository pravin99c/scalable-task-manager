name: Phase 6.10 — import verified npm lockfile (one-time)

on:
  push:
    branches:
      - feat/phase610-adopt-generated-npm-lockfile
    paths:
      - .github/workflows/import-verified-lockfile.yml

permissions:
  actions: read
  contents: write

jobs:
  import-reviewed-lockfile:
    if: github.repository == 'pravin99c/scalable-task-manager'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Download exact registry-resolved lockfile artifact
        uses: actions/download-artifact@v4
        with:
          name: taskforge-npm-lockfile-e41d73ac135e17432b5358664061bb2090ae2e16
          run-id: 45035787742
          github-token: ${{ github.token }}
          path: .
      - name: Verify exact source artifact and lockfile requirements
        run: |
          echo 'ca16a4ad02967053336e77e3d56af204d748b3b48f022c9eebd97f75eef47ffb  package-lock.json' | sha256sum --check --status
          python3 scripts/validate_npm_lockfile.py
      - name: Validate deterministic frontend install and tests
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: Commit lockfile to isolated feature branch only
        run: |
          test "${GITHUB_REF}" = 'refs/heads/feat/phase610-adopt-generated-npm-lockfile'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git diff --cached --quiet && { echo 'Nothing to commit.'; exit 0; }
          git commit -m "build: adopt verified npm registry lockfile"
          git push origin HEAD:refs/heads/feat/phase610-adopt-generated-npm-lockfile
